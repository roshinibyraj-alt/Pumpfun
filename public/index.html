<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>LEADER Terminal · 5m</title>
<style>
  :root {
    --void: #0a0e17;
    --surface: #121826;
    --surface-raised: #182034;
    --border: #232c40;
    --text: #eef2f8;
    --text-dim: #7c869c;
    --up: #2dd4bf;
    --up-dim: rgba(45,212,191,0.14);
    --down: #f5a623;
    --down-dim: rgba(245,166,35,0.14);
    --win: #34d399;
    --loss: #f87171;
    --tp: #60a5fa;
    --tp-dim: rgba(96,165,250,0.14);
    --e5m: #38bdf8;
    --e5m-dim: rgba(56,189,248,0.14);
    --font-data: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { background: var(--void); }
  body {
    margin: 0; background: var(--void); color: var(--text);
    font-family: var(--font-ui); padding: 16px 14px 40px;
    max-width: 640px; margin-inline: auto;
    animation: fadeIn 0.4s ease;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

  .statusbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; flex-wrap: wrap; gap: 6px; }
  .brand { display: flex; align-items: center; gap: 8px; }
  .brand .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--tp); animation: pulse 2s infinite; flex-shrink: 0; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }
  .brand h1 { font-size: 14px; font-weight: 600; margin: 0; letter-spacing: 0.2px; }
  .live-price { font-family: var(--font-data); font-size: 12px; color: var(--text-dim); text-align: right; }
  .live-price b { color: var(--text); font-weight: 600; }
  .live-price .sep { color: var(--border); }

  .engine { margin-bottom: 26px; }
  .engine-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  .engine-title { font-size: 14px; font-weight: 700; letter-spacing: 0.3px; display: flex; align-items: center; gap: 8px; }
  .engine-title .pill { font-size: 9px; text-transform: uppercase; letter-spacing: 0.6px; padding: 2px 8px; border-radius: 20px; }
  .pill.e5m { color: var(--e5m); background: var(--e5m-dim); }
  .engine-sub { font-size: 11px; color: var(--text-dim); font-weight: 400; }
  .engine-schedule { font-family: var(--font-data); font-size: 10.5px; color: var(--text-dim); }

  .hero { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px; margin-bottom: 10px; }
  .hero .row { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .hero .bankroll { font-family: var(--font-data); font-size: 30px; font-weight: 600; letter-spacing: -0.5px; }
  .hero .return { font-family: var(--font-data); font-size: 13px; font-weight: 600; padding: 3px 9px; border-radius: 20px; }
  .hero .return.pos { color: var(--win); background: rgba(52,211,153,0.12); }
  .hero .return.neg { color: var(--loss); background: rgba(248,113,113,0.12); }
  .hero .pnl-line { display: flex; gap: 16px; margin-top: 8px; font-size: 12px; color: var(--text-dim); flex-wrap: wrap; }
  .hero .pnl-line b { font-family: var(--font-data); color: var(--text); font-weight: 600; }

  .chips { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 10px; }
  .chip { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 8px 10px; min-width: 0; }
  .chip .k { font-size: 9px; text-transform: uppercase; letter-spacing: 0.7px; color: var(--text-dim); margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chip .v { font-family: var(--font-data); font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chip .v.pos { color: var(--win); }
  .chip .v.neg { color: var(--loss); }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 16px; margin-bottom: 10px; }
  .card-title { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--text-dim); margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
  .equity-canvas { width: 100%; height: 110px; display: block; }
  .countdown { font-family: var(--font-data); color: var(--text); background: var(--surface-raised); padding: 2px 8px; border-radius: 6px; font-size: 11px; }

  .pattern-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  .pattern-chip { font-family: var(--font-data); font-size: 12px; font-weight: 700; padding: 6px 12px; border-radius: 8px; background: var(--surface-raised); border: 1px solid var(--border); letter-spacing: 1px; }
  .signal-chip { font-family: var(--font-data); font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; padding: 3px 9px; border-radius: 6px; background: rgba(255,255,255,0.05); color: var(--text-dim); }
  .signal-chip.up { color: var(--up); background: var(--up-dim); }
  .signal-chip.down { color: var(--down); background: var(--down-dim); }

  .live-summary { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--text-dim); margin-bottom: 10px; }
  .live-summary b { font-family: var(--font-data); color: var(--text); }
  .position-box { padding: 12px; border-radius: 10px; font-family: var(--font-data); font-size: 12px; background: var(--surface-raised); border: 1px solid var(--border); margin-bottom: 8px; }
  .position-box .side-line { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .position-box .price-row { display: flex; justify-content: space-between; padding: 3px 0; }
  .position-box .price-row .lbl { color: var(--text-dim); font-size: 10px; text-transform: uppercase; }
  .position-box .status-pill { display: inline-block; font-size: 9px; text-transform: uppercase; letter-spacing: 0.4px; padding: 2px 7px; border-radius: 4px; margin-top: 6px; }
  .position-box .reason { color: var(--text-dim); font-size: 10px; margin-top: 6px; }
  .position-box.filled .status-pill { color: var(--down); background: var(--down-dim); }
  .position-box.filled { border-color: rgba(245,166,35,0.35); }
  .position-box.resolved_win .status-pill { color: var(--win); background: rgba(52,211,153,0.14); }
  .position-box.resolved_win { border-color: rgba(52,211,153,0.35); }
  .position-box.resolved_loss .status-pill { color: var(--loss); background: rgba(248,113,113,0.14); }
  .position-box.resolved_loss { border-color: rgba(248,113,113,0.35); }
  .position-box.stopped_out .status-pill { color: var(--loss); background: rgba(248,113,113,0.14); }
  .position-box.stopped_out { border-color: rgba(248,113,113,0.35); }

  .side-tag { display: inline-block; font-family: var(--font-data); font-size: 11px; font-weight: 700; letter-spacing: 0.5px; padding: 2px 8px; border-radius: 5px; background: var(--surface-raised); border: 1px solid var(--border); }
  .side-tag.up { color: var(--up); background: var(--up-dim); border-color: rgba(45,212,191,0.35); }
  .side-tag.down { color: var(--down); background: var(--down-dim); border-color: rgba(245,166,35,0.35); }
  .side-tag.skip { color: var(--text-dim); }

  .upnl { font-weight: 600; }
  .upnl.pos { color: var(--win); }
  .upnl.neg { color: var(--loss); }

  .entry { border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; background: var(--surface-raised); cursor: pointer; }
  .entry .row1 { display: flex; align-items: center; gap: 10px; }
  .entry .result-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .result-dot.win { background: var(--win); }
  .result-dot.loss { background: var(--loss); }
  .result-dot.skip { background: var(--text-dim); }
  .entry .mid { flex: 1; min-width: 0; }
  .entry .top { font-size: 12px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .entry .bottom { font-size: 10.5px; color: var(--text-dim); margin-top: 3px; }
  .entry .pnl { font-family: var(--font-data); font-size: 13px; font-weight: 700; text-align: right; flex-shrink: 0; }
  .entry .pnl.win { color: var(--win); }
  .entry .pnl.loss { color: var(--loss); }
  .entry .pnl.skip { color: var(--text-dim); }
  .entry .margin { display: block; font-size: 9px; font-weight: 500; color: var(--text-dim); }
  .entry .entry-detail { display: none; margin-top: 8px; border-top: 1px dashed var(--border); padding-top: 8px; font-size: 10.5px; color: var(--text-dim); }
  .entry .entry-detail.open { display: block; }
  .entry .drow { display: flex; justify-content: space-between; gap: 8px; padding: 2px 0; }
  .entry .drow span:first-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .entry .drow span:last-child { font-family: var(--font-data); color: var(--text); text-align: right; }

  .empty-state { color: var(--text-dim); font-size: 12px; text-align: center; padding: 18px 0; }
  .no-trade-box { color: var(--text-dim); font-size: 12px; text-align: center; padding: 16px 0; border: 1px dashed var(--border); border-radius: 10px; }

  .ladder { border: 1px solid var(--border); border-radius: 10px; overflow: hidden; margin-top: 4px; }
  .ladder-head, .ladder-row { display: grid; grid-template-columns: 64px 1fr 1fr; gap: 6px; padding: 5px 10px; font-family: var(--font-data); font-size: 11px; }
  .ladder-head { background: var(--surface-raised); color: var(--text-dim); text-transform: uppercase; font-size: 9px; letter-spacing: 0.7px; }
  .ladder-row { border-top: 1px solid var(--border); align-items: center; }
  .ladder-row .lvl { color: var(--text-dim); }
  .ladder-cell { text-align: center; border-radius: 6px; padding: 3px 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ladder-cell.open { color: var(--text-dim); background: var(--surface-raised); }
  .ladder-cell.filled.up { color: var(--up); background: var(--up-dim); }
  .ladder-cell.filled.down { color: var(--down); background: var(--down-dim); }
  .ladder-cell.cancelled { color: var(--text-dim); background: transparent; text-decoration: line-through; opacity: 0.55; }
  .sf-table { border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  .sf-row { display: grid; grid-template-columns: 1.1fr 1.3fr 0.8fr 0.8fr 0.9fr; gap: 6px; padding: 6px 10px; font-family: var(--font-data); font-size: 11px; align-items: center; }
  .sf-row + .sf-row { border-top: 1px solid var(--border); }
  .sf-row.sf-head { background: var(--surface-raised); color: var(--text-dim); text-transform: uppercase; font-size: 9px; letter-spacing: 0.7px; }
  .sf-row .sf-pnl { font-weight: 700; }
  .sf-row .sf-pnl.pos { color: var(--win); }
  .sf-row .sf-pnl.neg { color: var(--loss); }
  .sf-row.sf-best { outline: 1px solid var(--up); outline-offset: -1px; border-radius: 6px; background: rgba(45,212,191,0.08); }


  footer { text-align: center; color: var(--text-dim); font-size: 11px; margin-top: 20px; font-family: var(--font-data); }
</style>
</head>
<body>

  <div class="statusbar">
    <div class="brand">
      <span class="dot"></span>
      <h1>LEADER Terminal</h1>
    </div>
    <div class="live-price" id="livePrice">— —</div>
  </div>

  <div id="engines"></div>
  <div id="learnPanel"></div>

  <footer id="footer">—</footer>

<script>
  const $ = (id) => document.getElementById(id);
  const fmt$ = (n) => '$' + Number(n).toFixed(2);
  const fmtPct = (n, digits = 2) => (n * 100).toFixed(digits) + '%';

  function fmtCountdown(sec) {
    if (sec == null) return '—';
    if (sec < 0) sec = 0;
    const m = Math.floor(sec / 60), s = Math.floor(sec % 60);
    return m + ':' + String(s).padStart(2, '0');
  }

  function pnlCell(p) {
    return '<span class="sf-pnl ' + (p >= 0 ? 'pos' : 'neg') + '">' + (p >= 0 ? '+' : '') + fmt$(p) + '</span>';
  }

  function renderLearnPanel() {
    const el = $('learnPanel');
    if (!el) return;
    fetch('/api/learn').then((r) => r.json()).then((j) => {
      if (!j.found || !j.data) {
        el.innerHTML = '<div class="card"><div class="card-title"><span>LEADER — backtest on real history</span><span class="countdown">not ready</span></div><div class="empty-state">No backtest yet — run <code>npm run learn</code> or wait for the boot refresh (~1 min).</div></div>';
        return;
      }
      const d = j.data;
      const parts = Object.entries(d.engines || {}).map(([tf, e]) => {
        const v = e.variants || {};
        const leader = v.leader || {};
        const traded = leader.traded != null ? leader.traded : 0;
        const wins = leader.wins != null ? leader.wins : 0;
        const winRate = traded ? (wins / traded * 100).toFixed(1) + '%' : '—';
        const rungRows = (e.rungs || []).map((r) =>
          '<div class="sf-row" style="grid-template-columns:0.9fr 0.8fr 0.7fr 2fr 1fr 1fr 1fr">' +
            '<span>$' + r.level.toFixed(2) + '</span><span>' + r.touches + '</span><span>' + r.fills + '</span>' +
            '<span>' + (r.winRate != null ? (r.winRate * 100).toFixed(0) + '%' : '—') + ' <span class="sf-pnl ' + ((r.edge || 0) >= 0 ? 'pos' : 'neg') + '">(' + ((r.edge || 0) >= 0 ? '+' : '') + (r.edge * 100).toFixed(1) + '%)</span></span>' +
            '<span>' + (r.leaderWinRate != null ? (r.leaderWinRate * 100).toFixed(0) + '%' : '—') + '</span>' +
            '<span class="sf-pnl ' + ((r.leaderEdge || 0) >= 0 ? 'pos' : 'neg') + '">' + ((r.leaderEdge || 0) >= 0 ? '+' : '') + (r.leaderEdge * 100).toFixed(1) + '%</span>' +
            '<span>' + (r.avgPnl != null ? r.avgPnl.toFixed(2) : '—') + '</span>' +
          '</div>').join('');
        return '<div class="card">' +
          '<div class="card-title"><span>LEADER — backtest (real history, ' + tf + ')</span><span class="countdown">' + e.windows + ' windows · ' + fmtTime(d.fetchedAt) + '</span></div>' +
          '<div class="sf-table">' +
            '<div class="sf-row sf-head" style="grid-template-columns:1.4fr 1.2fr 0.7fr 0.7fr 0.9fr"><span>Strategy</span><span>Net P&amp;L</span><span>Traded</span><span>Wins</span><span>Win Rate</span></div>' +
            '<div class="sf-row" style="grid-template-columns:1.4fr 1.2fr 0.7fr 0.7fr 0.9fr"><span>LEADER (live)</span>' + pnlCell(leader.pnl || 0) + '<span>' + traded + '</span><span>' + wins + '</span><span>' + winRate + '</span></div>' +
          '</div>' +
          '<div style="margin-top:10px" class="sf-table">' +
            '<div class="sf-row sf-head" style="grid-template-columns:0.9fr 0.8fr 0.7fr 2fr 1fr 1fr 1fr"><span>Level</span><span>Touches</span><span>Fills</span><span>Dipper Win (edge)</span><span>Leader Win</span><span>Leader Edge</span><span>Avg P&amp;L/fill</span></div>' + rungRows +
          '</div>' +
          '<div class="drow" style="font-size:10px;color:var(--text-dim);margin-top:6px"><span>Trigger = a side dips to the level. Leader = opposite side bought via resting limit at the mirror price (1 − level). A positive leader edge means buying the non-dipping side pays.</span><span></span></div>' +
        '</div>';
      });
      el.innerHTML = parts.join('');
    }).catch(() => {});
  }

  function fmtTime(iso) {
    return iso ? new Date(iso).toLocaleString(undefined, { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit' }) : '—';
  }

  function ladderCounts(win) {
    const orders = (win && Array.isArray(win.orders)) ? win.orders : [];
    return {
      total: (win && win.triggered ? Object.keys(win.triggered).length : 0),
      filled: orders.filter((o) => o.status === 'filled').length,
      placed: orders.filter((o) => o.status === 'placed').length,
      expired: orders.filter((o) => o.status === 'expired').length,
    };
  }

  function strategyState(win, cfg, lc) {
    if (!win) return 'no window';
    const c = ladderCounts(win);
    return c.filled + ' fills confirmed · ' + c.placed + ' awaiting walk-through' + (c.expired ? ' · ' + c.expired + ' expired' : '');
  }

  function patternText(win) {
    if (!win) return 'no window';
    const c = ladderCounts(win);
    if (c.filled === 0 && c.placed === 0) return 'arming triggers — waiting for a side to dip to a level';
    if (c.filled === 0) return c.placed + ' order(s) placed — waiting for price to walk through';
    return c.filled + ' fill(s) confirmed · ' + c.placed + ' awaiting walk-through';
  }

  function enginePill(key) {
    return '<span class="pill e5m">' + key + '</span>';
  }

  function positionStatusLabel(pos) {
    if (pos.status === 'filled') return 'filled (limit) @ $' + pos.fillPrice.toFixed(2) + ' · riding to resolution';
    if (pos.status === 'resolved_win') return 'filled @ $' + pos.fillPrice.toFixed(2) + ' · won @ resolution';
    if (pos.status === 'resolved_loss') return 'filled @ $' + pos.fillPrice.toFixed(2) + ' · lost @ resolution';
    return pos.status;
  }

  function renderTriggerGrid(win, rungs) {
    if (!win) return '';
    const levels = (rungs && rungs.length ? rungs : [0.40, 0.35, 0.30, 0.25, 0.20, 0.15, 0.10]).slice().sort((a, b) => b - a);
    const orders = (win && Array.isArray(win.orders)) ? win.orders : [];
    const byKey = {};
    for (const o of orders) byKey[o.triggerSide + ':' + o.triggerLevel] = o;
    const cell = (triggerSide, lvl) => {
      const o = byKey[triggerSide + ':' + lvl];
      if (!o) return '<span class="ladder-cell"></span>';
      if (o.status === 'filled') return '<span class="ladder-cell filled ' + o.side.toLowerCase() + '">FILLED ' + o.shares + 'sh</span>';
      if (o.status === 'expired') return '<span class="ladder-cell cancelled">expired</span>';
      return '<span class="ladder-cell open">' + o.shares + 'sh placed</span>';
    };
    return '<div class="ladder">' +
      '<div class="ladder-head"><span>Trigger</span><span>UP dipped</span><span>DOWN dipped</span></div>' +
      levels.map((p) => '<div class="ladder-row"><span class="lvl">$' + p.toFixed(2) + '</span>' + cell('UP', p) + cell('DOWN', p) + '</div>').join('') +
    '</div>';
  }

  function renderPositionArea(win, live, rungs) {
    if (!win) return '<div class="empty-state">No open window.</div>';
    const entries = win.entries || [];
    const lv = (live && live.entries) || [];
    const triggerGridHtml = renderTriggerGrid(win, rungs);
    if (entries.length === 0) {
      return '<div class="no-trade-box" style="border:none;padding:4px 0 0">no fills confirmed yet — ' + triggerGridHtml + '</div>';
    }
    const summary = live
      ? '<div class="live-summary">' +
          '<span>Cost <b>$' + (live.costBasis || 0).toFixed(2) + '</b></span>' +
          '<span>Value <b>$' + (live.currentValue || 0).toFixed(2) + '</b></span>' +
          '<span>Unrealized <b class="' + ((live.unrealizedPnl || 0) >= 0 ? 'upnl pos' : 'upnl neg') + '">' + ((live.unrealizedPnl || 0) >= 0 ? '+' : '') + (live.unrealizedPnl || 0).toFixed(2) + '</b></span>' +
        '</div>'
      : '';
    return summary + entries.slice().reverse().map((pos, ri) => {
      const l = lv[entries.length - 1 - ri] || {};
      const upnl = l.unrealizedPnl;
      const upnlStr = upnl != null ? ((upnl >= 0 ? '+' : '') + upnl.toFixed(2)) : '—';
      const nowStr = l.currentPrice != null ? '$' + l.currentPrice.toFixed(3) : '—';
      return '<div class="position-box ' + pos.status + '">' +
        '<div class="side-line"><span class="side-tag ' + pos.side.toLowerCase() + '">' + pos.side + '</span><span>' + pos.shares + ' shares @ $' + pos.fillPrice.toFixed(2) + '</span>' +
        '<span class="upnl ' + (upnl != null ? (upnl >= 0 ? 'pos' : 'neg') : '') + '">' + upnlStr + '</span></div>' +
        '<div class="price-row"><span class="lbl">Now</span><span>' + nowStr + '</span>' +
        '<span class="lbl">Fee</span><span>$' + (l.fee || 0).toFixed(3) + '</span>' +
        '<span class="lbl">Rebate</span><span>$' + (l.rebate || 0).toFixed(3) + '</span></div>' +
        '<div class="reason">' + (pos.entryReason || '') + '</div>' +
        '<span class="status-pill">' + positionStatusLabel(pos) + '</span>' +
      '</div>';
    }).join('') + (triggerGridHtml ? '<div style="margin-top:10px">' + triggerGridHtml + '</div>' : '');
  }

  function renderHistory(hist) {
    if (!hist || hist.length === 0) return '<div class="empty-state">No windows resolved yet.</div>';
    return hist.slice().reverse().slice(0, 30).map((w) => {
      const cls = !w.traded ? 'skip' : (w.pnl >= 0 ? 'win' : 'loss');
      const marginPct = w.cost > 0 ? (w.pnl / w.cost) * 100 : 0;
      const sides = w.sides || [];
      const sideTag = w.traded
        ? '<span class="side-tag ' + (sides.length === 1 ? sides[0].toLowerCase() : '') + '">' + (sides.length ? sides.join('/') : '?') + '</span>'
        : '<span class="side-tag skip">no trade</span>';
      let detailRows = '<div class="drow"><span>Schedule</span><span>' + (w.signal || '(none)') + '</span></div>' +
        '<div class="drow"><span>Entries</span><span>' + (w.entryCount || 0) + ' orders' + (w.entryCount === 0 ? '' : '') + '</span></div>';
      (w.entries || []).forEach((p, i) => {
        detailRows += '<div class="drow"><span>#' + (i + 1) + ' ' + p.side + ' @ $' + p.fillPrice.toFixed(2) + ' (fee $' + (p.fillFee || 0).toFixed(3) + ', reb $' + (p.fillRebate || 0).toFixed(3) + ')</span><span>pnl $' + (p.pnl != null ? p.pnl.toFixed(2) : '—') + '</span></div>';
      });
      return '<div class="entry" onclick="this.querySelector(\'.entry-detail\').classList.toggle(\'open\')">' +
        '<div class="row1">' +
          '<span class="result-dot ' + cls + '"></span>' +
          '<div class="mid">' +
            '<div class="top">' + sideTag + ' <span class="side-tag ' + w.wonSide.toLowerCase() + '">' + w.wonSide + ' won</span></div>' +
            '<div class="bottom">payout $' + w.payout.toFixed(2) + ' − cost $' + w.cost.toFixed(2) + ' (fees $' + (w.totalFees || 0).toFixed(4) + ', rebates +$' + (w.totalRebates || 0).toFixed(4) + ') · ' + fmtTime(w.resolvedAt) + '</div>' +
          '</div>' +
          '<div class="pnl ' + cls + '">' + (w.traded ? (w.pnl >= 0 ? '+' : '') + w.pnl.toFixed(2) : '—') + (w.traded ? '<span class="margin">' + (marginPct >= 0 ? '+' : '') + marginPct.toFixed(2) + '%</span>' : '') + '</div>' +
        '</div>' +
        '<div class="entry-detail">' + detailRows + '</div>' +
      '</div>';
    }).join('');
  }

  function drawEquity(key, e) {
    const canvas = document.getElementById('eq-' + key);
    if (!canvas) return;
    const pts = (e && e.equityCurve) || [];
    const start = (e && e.startingBankroll != null) ? e.startingBankroll : 1000;
    const dpr = window.devicePixelRatio || 1;
    const w = canvas.clientWidth || 280;
    const h = 110;
    canvas.width = Math.max(1, Math.round(w * dpr));
    canvas.height = Math.round(h * dpr);
    const ctx = canvas.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);

    if (pts.length === 0) {
      ctx.fillStyle = 'rgba(124,134,156,0.85)';
      ctx.font = '11px ' + (getComputedStyle(document.body).getPropertyValue('--font-ui') || 'sans-serif');
      ctx.textAlign = 'center';
      ctx.fillText('waiting for first resolution…', w / 2, h / 2);
      return;
    }

    // Seed the chart with the starting bankroll as the origin so the
    // curve draws even after a single resolved window.
    const display = [{ bankroll: start }, ...pts];
    let min = start, max = start;
    for (const p of display) {
      if (p.bankroll < min) min = p.bankroll;
      if (p.bankroll > max) max = p.bankroll;
    }
    const span = max - min;
    if (span < 1) { max += 1; min -= 1; }
    else { min -= span * 0.08; max += span * 0.08; }

    const pad = 8;
    const X = (i) => pad + (i / (display.length - 1)) * (w - pad * 2);
    const Y = (v) => h - pad - ((v - min) / (max - min)) * (h - pad * 2);

    // baseline at starting bankroll
    ctx.strokeStyle = 'rgba(124,134,156,0.4)';
    ctx.setLineDash([4, 4]);
    ctx.beginPath();
    ctx.moveTo(pad, Y(start));
    ctx.lineTo(w - pad, Y(start));
    ctx.stroke();
    ctx.setLineDash([]);

    // area fill
    const grad = ctx.createLinearGradient(0, 0, 0, h);
    grad.addColorStop(0, 'rgba(45,212,191,0.22)');
    grad.addColorStop(1, 'rgba(45,212,191,0.02)');
    ctx.beginPath();
    for (let i = 0; i < display.length; i++) {
      const x = X(i), y = Y(display[i].bankroll);
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.lineTo(X(display.length - 1), h - pad);
    ctx.lineTo(X(0), h - pad);
    ctx.closePath();
    ctx.fillStyle = grad;
    ctx.fill();

    // line
    ctx.strokeStyle = '#2dd4bf';
    ctx.lineWidth = 1.6;
    ctx.lineJoin = 'round';
    ctx.beginPath();
    for (let i = 0; i < display.length; i++) {
      const x = X(i), y = Y(display[i].bankroll);
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();

    // last point marker
    const lx = X(display.length - 1), ly = Y(display[display.length - 1].bankroll);
    ctx.fillStyle = '#34d399';
    ctx.beginPath();
    ctx.arc(lx, ly, 2.6, 0, Math.PI * 2);
    ctx.fill();

    // min/max labels
    ctx.fillStyle = 'rgba(124,134,156,0.9)';
    ctx.font = '9px ui-monospace, monospace';
    ctx.textAlign = 'left';
    ctx.fillText('$' + max.toFixed(0), 2, 9);
    ctx.fillText('$' + min.toFixed(0), 2, h - 2);
  }


  function renderEngine(key, e) {
    const cfg = e.config || {};
    const live = e.liveWindow || { unrealizedPnl: 0 };
    const upnl = live.unrealizedPnl || 0;
    const equity = e.bankroll + upnl;
    const retPct = (equity - e.startingBankroll) / e.startingBankroll;
    const hist = e.windowHistory || [];
    const traded = hist.filter(w => w.traded);
    const totalPnl = hist.reduce((a, w) => a + w.pnl, 0) + upnl;
    const wins = traded.filter(w => w.pnl >= 0);
    const fills = [];
    for (const w of traded) for (const x of (w.entries || [])) if (x.fillPrice != null) fills.push(x.fillPrice);
    const win = e.currentWindow;
    const lc = e.lastCheck || {};
    const rungs = (cfg.LADDER_RUNGS && cfg.LADDER_RUNGS.length) ? cfg.LADDER_RUNGS : [0.40, 0.35, 0.30, 0.25, 0.20, 0.15, 0.10];
    const rungShares = cfg.RUNG_SHARES != null ? cfg.RUNG_SHARES : 50;
    const lc2 = ladderCounts(win);
    const streak = e.streak || { wins: 0, losses: 0 };
    const peak = e.peakBankroll != null ? e.peakBankroll : e.startingBankroll;
    const maxDD = e.maxDrawdown != null ? e.maxDrawdown : 0;
    const maxDDPct = e.maxDrawdownPct != null ? e.maxDrawdownPct : 0;
    const currDD = Math.max(0, peak - equity);
    const currDDPct = peak > 0 ? currDD / peak : 0;
    const schedule = 'LEADER · dip to ' + rungs.map((p) => '$' + p.toFixed(2)).join(' / ') + ' → buy opposite side ' + rungShares + 'sh @ mirror limit (dip $0.40 → $0.60 … $0.10 → $0.90) · no entries in first 2 min · fill confirmed on walk-through';

    return '<div class="engine">' +
      '<div class="engine-head">' +
        '<div class="engine-title">' + enginePill(key) + ' ' + key + ' Engine <span class="engine-sub">' + (cfg.WINDOW_MINUTES || '?') + '-min windows</span></div>' +
        '<div class="engine-schedule">' + schedule + '</div>' +
      '</div>' +

      '<div class="hero">' +
        '<div class="row">' +
          '<div class="bankroll">' + fmt$(e.bankroll) + '</div>' +
          '<div class="return ' + (retPct >= 0 ? 'pos' : 'neg') + '">' + (retPct >= 0 ? '+' : '') + fmtPct(retPct) + '</div>' +
        '</div>' +
        '<div class="pnl-line">' +
          '<span>Unrealized <b class="' + (upnl >= 0 ? 'upnl pos' : 'upnl neg') + '">' + (upnl >= 0 ? '+' : '') + upnl.toFixed(2) + '</b></span>' +
          '<span>Equity <b>' + fmt$(equity) + '</b></span>' +
          '<span>Live UP <b>' + (lc.upPrice != null ? '$' + lc.upPrice.toFixed(2) : '—') + '</b> · DOWN <b>' + (lc.downPrice != null ? '$' + lc.downPrice.toFixed(2) : '—') + '</b></span>' +
        '</div>' +
      '</div>' +

      '<div class="chips">' +
        '<div class="chip"><div class="k">Windows Resolved</div><div class="v">' + hist.length + '</div></div>' +
        '<div class="chip"><div class="k">Total PnL</div><div class="v ' + (totalPnl >= 0 ? 'pos' : 'neg') + '">' + fmt$(totalPnl) + '</div></div>' +
        '<div class="chip"><div class="k">Win Rate</div><div class="v">' + (traded.length ? wins.length + ' / ' + traded.length : '—') + '</div></div>' +
        '<div class="chip"><div class="k">Avg Fill</div><div class="v">' + (fills.length ? '$' + (fills.reduce((a, b) => a + b, 0) / fills.length).toFixed(2) : '—') + '</div></div>' +
        '<div class="chip"><div class="k">Pending</div><div class="v">' + (e.pendingResolutions || []).length + '</div></div>' +
        '<div class="chip"><div class="k">Triggers</div><div class="v ' + ((lc2 && lc2.filled > 0) ? 'pos' : '') + '">' + (win ? lc2.filled + ' / ' + lc2.total : '—') + '</div></div>' +
        '<div class="chip"><div class="k">Awaiting Walk-Thru</div><div class="v">' + (win ? lc2.placed : '—') + '</div></div>' +
        '<div class="chip"><div class="k">Expired</div><div class="v">' + (win ? lc2.expired : '—') + '</div></div>' +
        '<div class="chip"><div class="k">Order Latency</div><div class="v">' + ((win && win.lastLatencyMs != null) ? win.lastLatencyMs + 'ms' : ((live && live.triggers && live.triggers.lastLatencyMs != null) ? live.triggers.lastLatencyMs + 'ms' : '—')) + '</div></div>' +
        '<div class="chip"><div class="k">Win Streak</div><div class="v ' + (streak.wins > 0 ? 'pos' : '') + '">W' + streak.wins + '</div></div>' +
        '<div class="chip"><div class="k">Loss Streak</div><div class="v ' + (streak.losses > 0 ? 'neg' : '') + '">L' + streak.losses + '</div></div>' +
        '<div class="chip"><div class="k">Peak Capital</div><div class="v">' + fmt$(peak) + '</div></div>' +
        '<div class="chip"><div class="k">Max DD</div><div class="v ' + (maxDD > 0 ? 'neg' : '') + '">' + fmt$(maxDD) + ' (' + fmtPct(maxDDPct) + ')</div></div>' +
        '<div class="chip"><div class="k">Curr DD</div><div class="v ' + (currDD > 0 ? 'neg' : '') + '">' + fmt$(currDD) + ' (' + fmtPct(currDDPct) + ')</div></div>' +
        '<div class="chip"><div class="k">Fees / Rebates</div><div class="v" style="font-size:11px">$' + (e.totalFees || 0).toFixed(1) + ' / $' + (e.totalRebates || 0).toFixed(1) + '</div></div>' +
      '</div>' +

      '<div class="card">' +
        '<div class="card-title"><span>Equity Curve</span>' +
          '<span class="countdown">' + (e.equityCurve || []).length + ' pts · start $' + (e.startingBankroll != null ? e.startingBankroll.toFixed(0) : '?') + '</span></div>' +
        '<canvas id="eq-' + key + '" class="equity-canvas"></canvas>' +
      '</div>' +

      '<div class="card">' +
        '<div class="card-title"><span>Current Window</span>' +
          '<span class="countdown">' + (lc.secondsRemaining != null ? (lc.secondsRemaining > 0 ? fmtCountdown(lc.secondsRemaining) + ' left' : 'resolving…') : '—') + '</span></div>' +
        '<div class="pattern-row">' +
          '<span class="pattern-chip">' + (win ? patternText(win) : '— — —') + '</span>' +
          '<span class="signal-chip">' + strategyState(win, cfg, lc) + '</span>' +
        '</div>' +
        renderPositionArea(win, live, rungs) +
      '</div>' +

      '<div class="card">' +
        '<div class="card-title"><span>Resolved Windows</span></div>' +
        renderHistory(hist) +
      '</div>' +
    '</div>';
  }

  async function refresh() {
    let s;
    try {
      const res = await fetch('/api/state');
      s = await res.json();
    } catch (e) {
      console.error('fetch /api/state failed', e);
      $('footer').textContent = 'connection issue — retrying…';
      return;
    }

    const engines = s.engines || {};
    const keys = Object.keys(engines);

    try {
      const priceParts = keys.map((k) => {
        const lc = engines[k].lastCheck || {};
        return '<span>' + k + ' UP <b>' + (lc.upPrice != null ? '$' + lc.upPrice.toFixed(2) : '—') + '</b> · DOWN <b>' + (lc.downPrice != null ? '$' + lc.downPrice.toFixed(2) : '—') + '</b></span>';
      });
      $('livePrice').innerHTML = priceParts.length ? priceParts.join('<span class="sep">|</span>') : '— —';
    } catch (e) { console.error('header render failed', e); }

    try {
      $('engines').innerHTML = keys.map((k) => renderEngine(k, engines[k])).join('');
      keys.forEach((k) => drawEquity(k, engines[k]));
    } catch (e) { console.error('engines render failed', e); }

    renderLearnPanel();

    let lastTs = null;
    for (const k of keys) {
      const ts = engines[k].lastCheck && engines[k].lastCheck.timestamp;
      if (ts && (!lastTs || new Date(ts).getTime() < new Date(lastTs).getTime())) lastTs = ts;
    }
    $('footer').textContent = 'updated ' + new Date().toLocaleTimeString() + ' · polling every 1s' +
      (lastTs ? ' · bot last ticked ' + Math.max(0, Math.floor((Date.now() - new Date(lastTs).getTime()) / 1000)) + 's ago' : '') +
      (s.lastError ? ' · ⚠ ' + s.lastError : '');
  }

  refresh();
  setInterval(refresh, 1000);
</script>
</body>
</html>
