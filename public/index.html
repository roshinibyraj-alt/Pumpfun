<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cheap/Expensive Bot</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #000; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 12px; font-weight: 700; }
h1 { font-size: 18px; text-align: center; margin-bottom: 12px; letter-spacing: 1px; }
.status { font-size: 12px; text-align: center; color: #888; margin-bottom: 16px; }
.engine { background: #111; border: 1px solid #333; border-radius: 8px; padding: 12px; margin-bottom: 12px; }
.engine-title { font-size: 16px; font-weight: 700; margin-bottom: 8px; color: #fff; display: flex; justify-content: space-between; align-items: center; }
.engine-title .phase { font-size: 11px; color: #888; }
.row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
.stat { background: #000; border: 1px solid #333; border-radius: 6px; padding: 8px; flex: 1; min-width: 80px; }
.stat .label { font-size: 10px; color: #888; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
.stat .value { font-size: 18px; font-weight: 700; color: #fff; }
.stat .value.green { color: #00ff88; }
.stat .value.red { color: #ff4444; }
.stat .value.blue { color: #44aaff; }
.entries { margin-top: 8px; }
.entry { background: #000; border: 1px solid #333; border-radius: 4px; padding: 6px 8px; margin-bottom: 4px; font-size: 11px; display: flex; justify-content: space-between; }
.entry .side { font-weight: 700; }
.entry .side.up { color: #00ff88; }
.entry .side.down { color: #ff4444; }
.entry .details { color: #ccc; }
.history { margin-top: 12px; }
.history-item { background: #000; border: 1px solid #333; border-radius: 4px; padding: 6px 8px; margin-bottom: 4px; font-size: 11px; display: flex; justify-content: space-between; }
.history-item.win { border-color: #00ff88; }
.history-item.loss { border-color: #ff4444; }
canvas { width: 100%; height: 80px; display: block; margin-top: 8px; }
.phase-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; margin: 8px 0 4px 0; }
.phase-label.cheap { color: #00ff88; }
.phase-label.expensive { color: #ff4444; }
</style>
</head>
<body>
<h1>CHEAP / EXPENSIVE BOT</h1>
<div id="status" class="status">connecting…</div>
<div id="engines"></div>
<script>
const $ = id => document.getElementById(id);

function fmt$(n) { return '$' + (n || 0).toFixed(2); }
function fmtCountdown(s) {
  if (s <= 0) return '0:00';
  const m = Math.floor(s / 60);
  const sec = s % 60;
  return m + ':' + String(sec).padStart(2, '0');
}

function renderEngine(key, e) {
  const cfg = e.config || {};
  const live = e.liveWindow || {};
  const streak = e.streak || { wins: 0, losses: 0 };
  const peak = e.peakBankroll || e.startingBankroll || 0;
  const bankroll = e.bankroll || 0;
  const returnPct = e.startingBankroll ? ((bankroll - e.startingBankroll) / e.startingBankroll * 100) : 0;
  const dd = e.maxDrawdown || 0;
  const ddPct = e.maxDrawdownPct ? (e.maxDrawdownPct * 100) : 0;
  const currDD = peak - bankroll;
  const currDDPct = peak > 0 ? (currDD / peak * 100) : 0;
  const hist = e.windowHistory || [];
  const winCount = hist.filter(w => w.pnl >= 0).length;
  const lossCount = hist.filter(w => w.pnl < 0).length;
  const totalPnl = hist.reduce((a, w) => a + (w.pnl || 0), 0);
  const lc = e.lastCheck || {};
  const win = e.currentWindow;
  const elapsed = win ? Math.floor(Date.now() / 1000) - win.windowStart : 0;
  const remaining = lc.secondsRemaining || 0;
  const phase = elapsed < (cfg.PHASE1_SECONDS || 180) ? 'PHASE 1 — CHEAP' : 'PHASE 2 — EXPENSIVE';
  const entries = live.entries || [];
  const upEntries = entries.filter(en => en.side === 'UP');
  const downEntries = entries.filter(en => en.side === 'DOWN');

  let html = '<div class="engine">';
  html += '<div class="engine-title"><span>' + (cfg.WINDOW_MINUTES || '?') + ' MIN ENGINE</span><span class="phase">' + phase + '</span></div>';

  // Stats row 1
  html += '<div class="row">';
  html += '<div class="stat"><div class="label">Bankroll</div><div class="value">' + fmt$(bankroll) + '</div></div>';
  html += '<div class="stat"><div class="label">Return</div><div class="value ' + (returnPct >= 0 ? 'green' : 'red') + '">' + (returnPct >= 0 ? '+' : '') + returnPct.toFixed(2) + '%</div></div>';
  html += '<div class="stat"><div class="label">Peak</div><div class="value blue">' + fmt$(peak) + '</div></div>';
  html += '<div class="stat"><div class="label">Max DD</div><div class="value red">' + fmt$(dd) + ' (' + ddPct.toFixed(1) + '%)</div></div>';
  html += '</div>';

  // Stats row 2
  html += '<div class="row">';
  html += '<div class="stat"><div class="label">Wins</div><div class="value green">' + winCount + '</div></div>';
  html += '<div class="stat"><div class="label">Losses</div><div class="value red">' + lossCount + '</div></div>';
  html += '<div class="stat"><div class="label">Total PnL</div><div class="value ' + (totalPnl >= 0 ? 'green' : 'red') + '">' + fmt$(totalPnl) + '</div></div>';
  html += '<div class="stat"><div class="label">Fees</div><div class="value">' + fmt$(e.totalFees) + '</div></div>';
  html += '</div>';

  // Live prices + countdown
  html += '<div class="row">';
  html += '<div class="stat"><div class="label">UP</div><div class="value green">' + (lc.upPrice != null ? '$' + lc.upPrice.toFixed(3) : '—') + '</div></div>';
  html += '<div class="stat"><div class="label">DOWN</div><div class="value red">' + (lc.downPrice != null ? '$' + lc.downPrice.toFixed(3) : '—') + '</div></div>';
  html += '<div class="stat"><div class="label">Countdown</div><div class="value blue">' + (win ? fmtCountdown(remaining) : '—') + '</div></div>';
  html += '<div class="stat"><div class="label">Cost</div><div class="value">' + fmt$(live.totalCost) + '</div></div>';
  html += '</div>';

  // Current window entries
  if (entries.length > 0) {
    html += '<div class="phase-label cheap">CHEAP SIDE (' + (live.upShares || 0) + ' UP / ' + (live.downShares || 0) + ' DOWN)</div>';
    html += '<div class="entries">';
    for (const en of entries) {
      html += '<div class="entry">';
      html += '<span class="side ' + en.side.toLowerCase() + '">' + en.side + '</span>';
      html += '<span class="details">' + en.shares + 'sh @ $' + en.fillPrice.toFixed(3) + ' | ' + fmt$(en.shares * en.fillPrice) + ' | ' + en.entryReason + '</span>';
      html += '</div>';
    }
    html += '</div>';
  } else if (win) {
    html += '<div style="text-align:center;color:#888;font-size:11px;padding:8px;">Waiting for entries…</div>';
  }

  // Equity curve
  if (hist.length > 0) {
    html += '<canvas id="eq-' + key + '"></canvas>';
  }

  // History
  if (hist.length > 0) {
    html += '<div class="history">';
    html += '<div class="phase-label">RESOLVED WINDOWS (' + hist.length + ')</div>';
    for (const w of hist.slice(-20).reverse()) {
      const isWin = w.pnl >= 0;
      html += '<div class="history-item ' + (isWin ? 'win' : 'loss') + '">';
      html += '<span>' + (isWin ? '✓ WIN' : '✗ LOSS') + ' | ' + w.entries + ' entries | ' + fmt$(w.totalCost) + ' cost</span>';
      html += '<span>' + fmt$(w.totalPayout) + ' payout | ' + fmt$(w.pnl) + '</span>';
      html += '</div>';
    }
    html += '</div>';
  }

  html += '</div>';
  return html;
}

function drawEquity(key, e) {
  const canvas = document.getElementById('eq-' + key);
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const hist = (e.equityCurve || []).slice(-50);
  if (hist.length < 2) return;
  const rect = canvas.getBoundingClientRect();
  canvas.width = rect.width * 2;
  canvas.height = rect.height * 2;
  ctx.scale(2, 2);
  const w = rect.width, h = rect.height;
  const vals = hist.map(p => p.bankroll);
  const min = Math.min(...vals) * 0.98;
  const max = Math.max(...vals) * 1.02;
  const range = max - min || 1;
  ctx.clearRect(0, 0, w, h);
  ctx.strokeStyle = '#00ff88';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  for (let i = 0; i < vals.length; i++) {
    const x = (i / (vals.length - 1)) * w;
    const y = h - ((vals[i] - min) / range) * h;
    if (i === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  }
  ctx.stroke();
}

async function refresh() {
  let s;
  try {
    const res = await fetch('/api/state');
    s = await res.json();
  } catch (e) {
    $('status').textContent = 'connection error — retrying…';
    return;
  }
  const engines = s.engines || {};
  const keys = Object.keys(engines);
  let html = '';
  for (const k of keys) {
    html += renderEngine(k, engines[k]);
  }
  $('engines').innerHTML = html;
  for (const k of keys) {
    drawEquity(k, engines[k]);
  }
  $('status').textContent = 'updated ' + new Date().toLocaleTimeString() + ' | ' + (s.config.DEMO_MODE ? 'DEMO' : 'LIVE') + ' | ' + s.config.ASSET.toUpperCase();
}

refresh();
setInterval(refresh, 1000);
</script>
</body>
</html>
