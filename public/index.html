<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BTC Hedge 15m+5m</title>
<style>*{box-sizing:border-box;margin:0;padding:0}body{background:#000;color:#fff;font-family:'Courier New',monospace;font-weight:bold;font-size:13px;padding:9px}
.h{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.title{font-size:19px}.title span{color:#00ccff}.badge{padding:4px 10px;border-radius:14px;border:1px solid #333;font-size:11px}.demo{color:#ffcc00;background:#ffcc0018}
.timer{text-align:center;padding:10px;background:#050505;border:2px solid #222;border-radius:8px;margin-bottom:8px}.tv{font-size:40px;color:#00ccff;font-variant-numeric:tabular-nums;line-height:1}.tl{font-size:9px;color:#777;text-transform:uppercase;letter-spacing:2px;margin-top:3px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:8px}.box{background:#0d0d0d;border:1px solid #2a2a2a;border-radius:6px;padding:8px}.lb{font-size:9px;color:#777;text-transform:uppercase}.val{font-size:16px;margin-top:2px}
.green{color:#00ff88}.red{color:#ff4444}.acc{color:#00ccff}.warn{color:#ffcc00}
.card{background:#080808;border:1px solid #1e1e1e;border-radius:7px;padding:10px;margin-bottom:8px}
.prices{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;text-align:center;padding:8px 0}.price{font-size:22px}.plabel{font-size:8px;color:#777;text-transform:uppercase;letter-spacing:1px}
.poscard{border-left:3px solid #333;padding-left:10px;margin-bottom:6px;font-size:14px}.posdetail{font-size:11px;color:#aaa;margin-top:3px}
.sub{font-size:10px;color:#888;margin-top:6px;line-height:1.5}
#chart svg{width:100%;height:90px}#hist div{padding:4px 0;border-bottom:1px solid #151515;font-size:11px}#hist{max-height:160px;overflow-y:auto}
.phase{display:inline-block;padding:3px 12px;border-radius:10px;font-size:10px;margin-top:5px}.observing{color:#ffcc00;background:#ffcc0015}.firedp{color:#00ff88;background:#00ff8815}.waiting{color:#666;background:#ffffff08}
@media(max-width:600px){.grid{grid-template-columns:repeat(2,1fr)}.val{font-size:13px}.price{font-size:17px}.tv{font-size:32px}}</style></head><body>
<div class="h"><div class="title">BTC <span>HEDGE</span> 15m+3×5m</div><div id="mode" class="badge demo">DEMO</div></div>
<div class="timer"><div class="tv" id="timer">--</div><div class="tl">BASE WINDOW SECONDS LEFT</div><br><span id="phase" class="phase waiting">WAITING…</span></div>
<div class="grid" id="top"></div>
<div class="card">
<div class="prices">
<div><div class="plabel">15m UP</div><div class="price acc" id="u15">--</div></div>
<div><div class="plabel">15m DN</div><div class="price warn" id="d15">--</div></div>
<div><div class="plabel">5m UP</div><div class="price acc" id="u5" style="opacity:.6">--</div></div>
<div><div class="plabel">5m DN</div><div class="price warn" id="d5" style="opacity:.6">--</div></div>
<div><div class="plabel">SUB#</div><div class="price" style="color:#888" id="subN">--</div></div>
<div><div class="plabel">HEDGE</div><div class="price" style="font-size:14px" id="hedgeS">--</div></div>
</div></div>
<div class="card"><div style="font-size:9px;color:#777;text-transform:uppercase;margin-bottom:7px">POSITIONS</div><div id="posarea"></div>
<div class="sub">UP 150sh base @t=0 · DOWN 50sh hedge sub#1 · re-hedge sub#2 if #1 won · no trades sub#3</div></div>
<div class="card"><div style="font-size:9px;color:#777;text-transform:uppercase;margin-bottom:5px">EQUITY CURVE</div><div id="chart"><svg viewBox="0 0 600 90" preserveAspectRatio="none"><polyline id="eqline" fill="none" stroke="#00ccff" stroke-width="2.5"/></svg></div></div>
<div class="card"><div style="font-size:9px;color:#777;text-transform:uppercase;margin-bottom:5px">WINDOW HISTORY</div><div id="hist"></div></div>
<script src="/socket.io/socket.io.js"></script><script>
var s=null;
function q(id){return document.getElementById(id)}
function f2(n){return n==null?'--':Number(n).toFixed(2)}function f3(n){return n==null?'--':Number(n).toFixed(3)}
function sg(n){return n>0?'+$'+f2(n):n<0? '-$'+f2(Math.abs(n)):'$'+f2(n)}function cl(n){return n>0?'green':n<0?'red':''}
function bx(l,v){return '<div class="box"><div class="lb">'+l+'</div><div class="val">'+v+'</div></div>'}
async function poll(){try{var r=await fetch('/api/state');s=await r.json();render()}catch(_){}}
function render(){if(!s)return;
 q('mode').textContent=s.demoMode?'DEMO':'LIVE';
 var lc=s.engine.lastCheck||{};
 var sr=lc.secondsRemaining||0;q('timer').textContent=sr;
 var ph=q('phase'),hs=lc.hedgeState||'initial';
 if(hs==='rearm_sub2'){ph.textContent='RE-ARM SUB#2';ph.className='phase firedp'}
 else if(hs==='holding_sub2'){ph.textContent='HOLDING SUB#2';ph.className='phase observing'}
 else if(hs==='idle'){ph.textContent='IDLE — NO MORE HEDGES';ph.className='phase waiting'}
 else if(s.engine.currentWindow){ph.textContent='ACTIVE';ph.className='phase firedp'}
 else{ph.textContent='DISCOVERING…';ph.className='phase waiting'}
 var pnl=s.engine.bankroll-s.engine.startingBankroll;
 q('top').innerHTML=bx('BANKROLL','$'+f2(s.engine.bankroll))+bx('PNL','<span class="'+cl(pnl)+'">'+sg(pnl)+'</span>')+bx('W/L','<span class="green">'+(s.engine.streak?.wins||0)+'W</span>/<span class="red">'+(s.engine.streak?.losses||0)+'L</span>')+bx('MAX DD','$'+f2(s.engine.maxDrawdown||0));
 q('u15').textContent=f3(lc.up15m);q('d15').textContent=f3(lc.down15m);
 q('u5').textContent=f3(lc.up5m);q('d5').textContent=f3(lc.down5m);
 q('subN').textContent=(lc.subIndex!=null)?'#'+(lc.subIndex+1):'--';
 q('hedgeS').textContent=(lc.hedgeState||'--').replace(/_/g,' ');
 var pa=q('posarea');
 if(s.engine.currentWindow&&s.engine.currentWindow.entries&&s.engine.currentWindow.entries.length){
   var h='';s.engine.currentWindow.entries.forEach(function(e){if(e.status!=='filled')return;
     var mid=e.side==='UP'?(lc.up15m||e.fillPrice):(lc.down5m||lc.down15m||e.fillPrice);var fl=e.shares*mid-e.shares*e.fillPrice;
     h+='<div class="poscard" style="border-color:'+(fl>=0?'#00ff88':'#ff4444')+'">'+e.side+' '+e.shares+'sh @'+f3(e.fillPrice)+' <span class="'+cl(fl)+'">'+sg(fl)+'</span></div>'});
   pa.innerHTML=h||'<div style="color:#444">No open positions</div>';
 }else pa.innerHTML='<div style="color:#444">No positions</div>';
 renderChart();renderHist();
}
function renderChart(){var ec=s.engine.equityCurve;if(!ec||ec.length<2)return;
 var vals=ec.map(function(x){return x.equity});vals.push(s.engine.startingBankroll);
 var lo=Math.min.apply(null,vals),hi=Math.max.apply(null,vals),rg=(hi-lo)||1;
 q('eqline').setAttribute('points',ec.map(function(v,i){return((i/(ec.length-1)*600).toFixed(1))+','+((85-(v.equity-lo)/rg*75).toFixed(1))}).join(' '))}
function renderHist(){var wh=s.engine.windowHistory||[];var h='';
 for(var i=wh.length-1;i>=Math.max(0,wh.length-30);i--){var w=wh[i];h+='<div>'+w.sides+' → <span class="'+cl(w.pnl)+'">'+sg(w.pnl)+'</span></div>'}
 q('hist').innerHTML=h||'<div style="color:#444">No windows yet</div>'}
setInterval(poll,2000);poll();
</script></body></html>
