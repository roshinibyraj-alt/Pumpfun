<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ladder Terminal</title>
<style>
  :root {
    --void: #0a0e17;
    --surface: #121826;
    --surface-raised: #182034;
    --border: #232c40;
    --text: #eef2f8;
    --text-dim: #7c869c;
    --up: #2dd4bf;
    --up-dim: rgba(45,212,191,0.14);
    --down: #f5a623;
    --down-dim: rgba(245,166,35,0.14);
    --win: #34d399;
    --loss: #f87171;
    --lock: #a78bfa;
    --lock-dim: rgba(167,139,250,0.14);
    --font-data: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { background: var(--void); }
  body {
    margin: 0; background: var(--void); color: var(--text);
    font-family: var(--font-ui); padding: 16px 14px 40px;
    max-width: 560px; margin-inline: auto;
    animation: fadeIn 0.4s ease;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

  .statusbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; flex-wrap: wrap; gap: 6px; }
  .brand { display: flex; align-items: center; gap: 8px; }
  .brand .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--lock); animation: pulse 2s infinite; flex-shrink: 0; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }
  .brand h1 { font-size: 14px; font-weight: 600; margin: 0; letter-spacing: 0.2px; }
  .live-price { font-family: var(--font-data); font-size: 13px; color: var(--text-dim); }
  .live-price b { color: var(--text); font-weight: 600; }

  .hero { margin-bottom: 16px; }
  .hero .label { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--text-dim); margin-bottom: 6px; }
  .hero .row { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .hero .bankroll { font-family: var(--font-data); font-size: 40px; font-weight: 600; letter-spacing: -0.5px; }
  .hero .return { font-family: var(--font-data); font-size: 15px; font-weight: 600; padding: 3px 9px; border-radius: 20px; }
  .hero .return.pos { color: var(--win); background: rgba(52,211,153,0.12); }
  .hero .return.neg { color: var(--loss); background: rgba(248,113,113,0.12); }
  .sparkline { margin-top: 10px; width: 100%; height: 48px; display: block; }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 16px; margin-bottom: 12px; }
  .card-title { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--text-dim); margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
  .countdown { font-family: var(--font-data); color: var(--text); background: var(--surface-raised); padding: 2px 8px; border-radius: 6px; font-size: 11px; }

  .ladder-wrap { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .ladder-col .col-head { font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-dim); margin-bottom: 6px; display: flex; justify-content: space-between; }
  .ladder-col.up .col-head { color: var(--up); }
  .ladder-col.down .col-head { color: var(--down); }
  .rung { display: flex; align-items: center; justify-content: space-between; padding: 6px 8px; border-radius: 6px; margin-bottom: 4px; font-family: var(--font-data); font-size: 12px; background: var(--surface-raised); border: 1px solid var(--border); }
  .rung .px { font-weight: 700; }
  .rung .status { font-size: 9px; text-transform: uppercase; letter-spacing: 0.4px; padding: 1px 6px; border-radius: 4px; }
  .rung.waiting { opacity: 0.55; }
  .rung.waiting .status { color: var(--text-dim); background: rgba(255,255,255,0.04); }
  .rung.base_filled .status { color: var(--down); background: var(--down-dim); }
  .rung.base_filled { border-color: rgba(245,166,35,0.35); }
  .rung.counter_filled .status { color: var(--lock); background: var(--lock-dim); }
  .rung.counter_filled { border-color: rgba(167,139,250,0.35); }

  .chips { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 12px; }
  .chip { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px 8px; text-align: center; }
  .chip .k { font-size: 9px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 5px; }
  .chip .v { font-family: var(--font-data); font-size: 17px; font-weight: 700; }

  .entry { padding: 10px 0; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; }
  .entry:last-child { border-bottom: none; }
  .entry .result-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .entry .result-dot.win { background: var(--win); } .entry .result-dot.loss { background: var(--loss); } .entry .result-dot.lock { background: var(--lock); }
  .entry .mid { flex: 1; min-width: 0; }
  .entry .mid .top { font-size: 13px; font-weight: 600; display: flex; gap: 6px; align-items: center; }
  .entry .mid .bottom { font-family: var(--font-data); font-size: 11px; color: var(--text-dim); margin-top: 2px; }
  .entry .pnl { font-family: var(--font-data); font-size: 14px; font-weight: 700; text-align: right; flex-shrink: 0; }
  .entry .pnl.win { color: var(--win); } .entry .pnl.loss { color: var(--loss); } .entry .pnl.lock { color: var(--lock); }
  .side-tag { font-family: var(--font-data); font-size: 10px; padding: 2px 7px; border-radius: 5px; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 700; }
  .side-tag.up { color: var(--up); background: var(--up-dim); }
  .side-tag.down { color: var(--down); background: var(--down-dim); }
  .empty-state { color: var(--text-dim); font-size: 13px; text-align: center; padding: 18px 0; }

  footer { text-align: center; color: var(--text-dim); font-size: 11px; margin-top: 20px; font-family: var(--font-data); }
</style>
</head>
<body>

  <div class="statusbar">
    <div class="brand">
      <span class="dot"></span>
      <h1>Ladder Terminal</h1>
    </div>
    <div class="live-price" id="livePrice">— —</div>
  </div>

  <div class="hero">
    <div class="label">Bankroll</div>
    <div class="row">
      <div class="bankroll" id="bankroll">$—</div>
      <div class="return" id="returnPct">—</div>
    </div>
    <svg class="sparkline" id="sparkline" preserveAspectRatio="none"></svg>
  </div>

  <div class="chips">
    <div class="chip"><div class="k">Windows Resolved</div><div class="v" id="windowsResolved">—</div></div>
    <div class="chip"><div class="k">Total PnL</div><div class="v" id="totalPnl">—</div></div>
    <div class="chip"><div class="k">Avg PnL/Window</div><div class="v" id="avgPnl">—</div></div>
    <div class="chip"><div class="k">Pending</div><div class="v" id="pendingCount">—</div></div>
  </div>

  <div class="card">
    <div class="card-title">
      <span>Current Ladder</span>
      <span class="countdown" id="countdown">—</span>
    </div>
    <div class="ladder-wrap">
      <div class="ladder-col up">
        <div class="col-head"><span>UP</span><span id="upLivePx">—</span></div>
        <div id="upLadder"></div>
      </div>
      <div class="ladder-col down">
        <div class="col-head"><span>DOWN</span><span id="downLivePx">—</span></div>
        <div id="downLadder"></div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-title"><span>Resolved Windows</span></div>
    <div id="completedLog"><div class="empty-state">No windows resolved yet.</div></div>
  </div>

  <footer id="footer">—</footer>

<script>
  const $ = (id) => document.getElementById(id);
  const fmt$ = (n) => '$' + Number(n).toFixed(2);
  const fmtPct = (n, digits=2) => (n * 100).toFixed(digits) + '%';

  function fmtCountdown(sec) {
    if (sec == null) return '—';
    if (sec < 0) sec = 0;
    const m = Math.floor(sec / 60), s = Math.floor(sec % 60);
    return m + ':' + String(s).padStart(2,'0');
  }

  function buildSparkline(points) {
    const svg = $('sparkline');
    if (points.length < 2) { svg.innerHTML = ''; return; }
    const w = 500, h = 48, pad = 3;
    const min = Math.min(...points), max = Math.max(...points);
    const range = (max - min) || 1;
    const stepX = (w - pad*2) / (points.length - 1);
    const coords = points.map((p, i) => {
      const x = pad + i*stepX;
      const y = pad + (h - pad*2) * (1 - (p - min) / range);
      return [x, y];
    });
    const path = coords.map((c,i) => (i===0?'M':'L') + c[0].toFixed(1) + ',' + c[1].toFixed(1)).join(' ');
    const areaPath = path + ' L' + coords[coords.length-1][0].toFixed(1) + ',' + h + ' L' + coords[0][0].toFixed(1) + ',' + h + ' Z';
    const up = points[points.length-1] >= points[0];
    const stroke = up ? '#34d399' : '#f87171';
    svg.setAttribute('viewBox', '0 0 ' + w + ' ' + h);
    svg.innerHTML = '<defs><linearGradient id="sgrad" x1="0" y1="0" x2="0" y2="1">' +
      '<stop offset="0%" stop-color="' + stroke + '" stop-opacity="0.25"/>' +
      '<stop offset="100%" stop-color="' + stroke + '" stop-opacity="0"/>' +
      '</linearGradient></defs>' +
      '<path d="' + areaPath + '" fill="url(#sgrad)" stroke="none"/>' +
      '<path d="' + path + '" fill="none" stroke="' + stroke + '" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
  }

  function statusLabel(rung) {
    if (rung.status === 'waiting_base') return 'waiting';
    if (rung.status === 'base_filled') return 'filled, hedging @ $' + rung.counterPrice.toFixed(2);
    if (rung.status === 'counter_filled') return 'both legs filled, awaiting resolution';
    return rung.status;
  }

  function renderLadderCol(elId, rungs, side) {
    const el = $(elId);
    const sideRungs = rungs.filter(r => r.side === side).sort((a,b) => b.rungPrice - a.rungPrice);
    if (sideRungs.length === 0) { el.innerHTML = '<div class="empty-state">—</div>'; return; }
    el.innerHTML = sideRungs.map(r => {
      const cls = r.status === 'counter_filled' ? 'counter_filled' : (r.status === 'base_filled' ? 'base_filled' : 'waiting');
      return '<div class="rung ' + cls + '">' +
        '<span class="px">$' + r.rungPrice.toFixed(2) + '</span>' +
        '<span class="status">' + statusLabel(r) + '</span>' +
      '</div>';
    }).join('');
  }

  async function refresh() {
    let s;
    try {
      const res = await fetch('/api/state');
      s = await res.json();
    } catch (e) {
      console.error('fetch /api/state failed', e);
      $('footer').textContent = 'connection issue — retrying…';
      return;
    }

    try {
      const lc = s.lastCheck;
      $('livePrice').innerHTML = lc ? s.config.ASSET.toUpperCase() + ' market' : '—';
      $('countdown').textContent = lc ? (Math.max(0, lc.secondsRemaining) > 0 ? fmtCountdown(lc.secondsRemaining) + ' left' : 'resolving…') : '—';
      $('upLivePx').textContent = lc ? '$' + lc.upPrice.toFixed(3) : '—';
      $('downLivePx').textContent = lc ? '$' + lc.downPrice.toFixed(3) : '—';
    } catch (e) { console.error('header render failed', e); }

    try {
      $('bankroll').textContent = fmt$(s.bankroll);
      const retPct = (s.bankroll - s.startingBankroll) / s.startingBankroll;
      const retEl = $('returnPct');
      retEl.textContent = (retPct >= 0 ? '+' : '') + fmtPct(retPct, 2);
      retEl.className = 'return ' + (retPct >= 0 ? 'pos' : 'neg');
    } catch (e) { console.error('bankroll render failed', e); }

    try {
      const curve = [s.startingBankroll];
      for (const w of s.windowHistory) curve.push(w.bankrollAfter);
      buildSparkline(curve);
    } catch (e) { console.error('sparkline render failed', e); }

    try {
      const rungs = s.currentWindow ? s.currentWindow.rungs : [];
      renderLadderCol('upLadder', rungs, 'UP');
      renderLadderCol('downLadder', rungs, 'DOWN');
    } catch (e) { console.error('ladder render failed', e); }

    try {
      const hist = s.windowHistory;
      $('windowsResolved').textContent = hist.length;
      const totalPnl = hist.reduce((a,w) => a+w.pnl, 0);
      $('totalPnl').textContent = fmt$(totalPnl);
      $('totalPnl').style.color = totalPnl >= 0 ? 'var(--win)' : 'var(--loss)';
      $('avgPnl').textContent = hist.length ? fmt$(totalPnl/hist.length) : '—';
      $('pendingCount').textContent = s.pendingResolutions.length;
    } catch (e) { console.error('chips render failed', e); }

    try {
      const logEl = $('completedLog');
      const all = s.windowHistory.slice().reverse().slice(0, 40);
      if (all.length === 0) {
        logEl.innerHTML = '<div class="empty-state">No windows resolved yet.</div>';
      } else {
        const fmtTime = (iso) => iso ? new Date(iso).toLocaleString(undefined,{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit',second:'2-digit'}) : '—';
        logEl.innerHTML = all.map(w => {
          const cls = w.pnl >= 0 ? 'win' : 'loss';
          return '<div class="entry">' +
            '<span class="result-dot ' + cls + '"></span>' +
            '<div class="mid">' +
              '<div class="top"><span class="side-tag ' + w.wonSide.toLowerCase() + '">' + w.wonSide + '</span> won · UP ' + w.totalUpShares + 'sh/$' + w.totalUpCost.toFixed(2) + ' · DOWN ' + w.totalDownShares + 'sh/$' + w.totalDownCost.toFixed(2) + '</div>' +
              '<div class="bottom">payout $' + w.payout.toFixed(2) + ' − cost $' + w.cost.toFixed(2) + ' · ' + fmtTime(w.resolvedAt) + '</div>' +
            '</div>' +
            '<div class="pnl ' + cls + '">' + (w.pnl >= 0 ? '+' : '') + w.pnl.toFixed(2) + '</div>' +
          '</div>';
        }).join('');
      }
    } catch (e) { console.error('completed log render failed', e); }

    $('footer').textContent = 'updated ' + new Date().toLocaleTimeString() + ' · polling every 1s' +
      (s.lastCheck ? ' · bot last ticked ' + Math.max(0, Math.floor((Date.now() - new Date(s.lastCheck.timestamp).getTime())/1000)) + 's ago' : '');
  }

  refresh();
  setInterval(refresh, 1000);
</script>
</body>
</html>
