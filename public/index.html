<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pattern Terminal</title>
<style>
  :root {
    --void: #0a0e17;
    --surface: #121826;
    --surface-raised: #182034;
    --border: #232c40;
    --text: #eef2f8;
    --text-dim: #7c869c;
    --up: #2dd4bf;
    --up-dim: rgba(45,212,191,0.14);
    --down: #f5a623;
    --down-dim: rgba(245,166,35,0.14);
    --win: #34d399;
    --loss: #f87171;
    --chop: #a78bfa;
    --chop-dim: rgba(167,139,250,0.14);
    --tp: #60a5fa;
    --tp-dim: rgba(96,165,250,0.14);
    --font-data: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { background: var(--void); }
  body {
    margin: 0; background: var(--void); color: var(--text);
    font-family: var(--font-ui); padding: 16px 14px 40px;
    max-width: 560px; margin-inline: auto;
    animation: fadeIn 0.4s ease;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

  .statusbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; flex-wrap: wrap; gap: 6px; }
  .brand { display: flex; align-items: center; gap: 8px; }
  .brand .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--tp); animation: pulse 2s infinite; flex-shrink: 0; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }
  .brand h1 { font-size: 14px; font-weight: 600; margin: 0; letter-spacing: 0.2px; }
  .live-price { font-family: var(--font-data); font-size: 13px; color: var(--text-dim); }
  .live-price b { color: var(--text); font-weight: 600; }

  .hero { margin-bottom: 16px; }
  .hero .label { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--text-dim); margin-bottom: 6px; }
  .hero .row { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .hero .bankroll { font-family: var(--font-data); font-size: 40px; font-weight: 600; letter-spacing: -0.5px; }
  .hero .return { font-family: var(--font-data); font-size: 15px; font-weight: 600; padding: 3px 9px; border-radius: 20px; }
  .hero .return.pos { color: var(--win); background: rgba(52,211,153,0.12); }
  .hero .return.neg { color: var(--loss); background: rgba(248,113,113,0.12); }
  .sparkline { margin-top: 10px; width: 100%; height: 48px; display: block; }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 16px; margin-bottom: 12px; }
  .card-title { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--text-dim); margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
  .countdown { font-family: var(--font-data); color: var(--text); background: var(--surface-raised); padding: 2px 8px; border-radius: 6px; font-size: 11px; }

  .pattern-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  .pattern-chip { font-family: var(--font-data); font-size: 13px; font-weight: 700; padding: 6px 12px; border-radius: 8px; background: var(--surface-raised); border: 1px solid var(--border); letter-spacing: 1px; }
  .signal-chip { font-family: var(--font-data); font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; padding: 3px 9px; border-radius: 6px; background: rgba(255,255,255,0.05); color: var(--text-dim); }
  .signal-chip.up { color: var(--up); background: var(--up-dim); }
  .signal-chip.down { color: var(--down); background: var(--down-dim); }
  .signal-chip.chop { color: var(--chop); background: var(--chop-dim); }

  .position-box { padding: 12px; border-radius: 10px; font-family: var(--font-data); font-size: 12px; background: var(--surface-raised); border: 1px solid var(--border); }
  .position-box .side-line { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .position-box .price-row { display: flex; justify-content: space-between; padding: 3px 0; }
  .position-box .price-row .lbl { color: var(--text-dim); font-size: 10px; text-transform: uppercase; }
  .position-box .status-pill { display: inline-block; font-size: 9px; text-transform: uppercase; letter-spacing: 0.4px; padding: 2px 7px; border-radius: 4px; margin-top: 6px; }
  .position-box.order_pending .status-pill { color: var(--text-dim); background: rgba(255,255,255,0.06); }
  .position-box.filled .status-pill { color: var(--down); background: var(--down-dim); }
  .position-box.filled { border-color: rgba(245,166,35,0.35); }
  .position-box.tp_filled .status-pill, .position-box.resolved_win .status-pill { color: var(--win); background: rgba(52,211,153,0.14); }
  .position-box.tp_filled, .position-box.resolved_win { border-color: rgba(52,211,153,0.35); }
  .position-box.resolved_loss .status-pill { color: var(--loss); background: rgba(248,113,113,0.14); }
  .position-box.resolved_loss { border-color: rgba(248,113,113,0.35); }
  .no-trade-box { padding: 14px; border-radius: 10px; background: var(--surface-raised); border: 1px dashed var(--border); color: var(--text-dim); font-size: 12px; text-align: center; }

  .chips { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 12px; }
  .chip { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px 8px; text-align: center; }
  .chip .k { font-size: 9px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 5px; }
  .chip .v { font-family: var(--font-data); font-size: 17px; font-weight: 700; }
  .chip .v.warn { color: var(--loss); }

  .entry { padding: 10px 0; border-bottom: 1px solid var(--border); cursor: pointer; }
  .entry:last-child { border-bottom: none; }
  .entry .row1 { display: flex; align-items: center; gap: 10px; }
  .entry .result-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .entry .result-dot.win { background: var(--win); } .entry .result-dot.loss { background: var(--loss); } .entry .result-dot.skip { background: var(--text-dim); }
  .entry .mid { flex: 1; min-width: 0; }
  .entry .mid .top { font-size: 13px; font-weight: 600; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .entry .mid .bottom { font-family: var(--font-data); font-size: 11px; color: var(--text-dim); margin-top: 2px; }
  .entry .pnl { font-family: var(--font-data); font-size: 14px; font-weight: 700; text-align: right; flex-shrink: 0; }
  .entry .pnl.win { color: var(--win); } .entry .pnl.loss { color: var(--loss); } .entry .pnl.skip { color: var(--text-dim); }
  .entry .pnl .margin { display: block; font-size: 10px; font-weight: 500; color: var(--text-dim); margin-top: 1px; }
  .side-tag { font-family: var(--font-data); font-size: 10px; padding: 2px 7px; border-radius: 5px; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 700; }
  .side-tag.up { color: var(--up); background: var(--up-dim); }
  .side-tag.down { color: var(--down); background: var(--down-dim); }
  .side-tag.skip { color: var(--text-dim); background: rgba(255,255,255,0.05); }
  .fill-badge { font-family: var(--font-data); font-size: 10px; padding: 1px 6px; border-radius: 5px; color: var(--text-dim); background: rgba(255,255,255,0.05); }
  .fill-badge.tp { color: var(--tp); background: var(--tp-dim); }
  .empty-state { color: var(--text-dim); font-size: 13px; text-align: center; padding: 18px 0; }
  .entry-detail { display: none; margin-top: 10px; padding: 10px; background: var(--surface-raised); border-radius: 8px; border: 1px solid var(--border); }
  .entry-detail.open { display: block; }
  .entry-detail .drow { display: flex; justify-content: space-between; font-family: var(--font-data); font-size: 11px; padding: 3px 0; border-bottom: 1px solid var(--border); }
  .entry-detail .drow:last-child { border-bottom: none; }

  footer { text-align: center; color: var(--text-dim); font-size: 11px; margin-top: 20px; font-family: var(--font-data); }
</style>
</head>
<body>

  <div class="statusbar">
    <div class="brand">
      <span class="dot"></span>
      <h1>Pattern Terminal</h1>
    </div>
    <div class="live-price" id="livePrice">— —</div>
  </div>

  <div class="hero">
    <div class="label">Bankroll</div>
    <div class="row">
      <div class="bankroll" id="bankroll">$—</div>
      <div class="return" id="returnPct">—</div>
    </div>
    <svg class="sparkline" id="sparkline" preserveAspectRatio="none"></svg>
  </div>

  <div class="chips">
    <div class="chip"><div class="k">Windows Resolved</div><div class="v" id="windowsResolved">—</div></div>
    <div class="chip"><div class="k">Total PnL</div><div class="v" id="totalPnl">—</div></div>
    <div class="chip"><div class="k">Avg PnL/Trade</div><div class="v" id="avgPnl">—</div></div>
    <div class="chip"><div class="k">Pending</div><div class="v" id="pendingCount">—</div></div>
  </div>
  <div class="chips">
    <div class="chip"><div class="k">Loss Streak</div><div class="v" id="lossStreak">—</div></div>
    <div class="chip"><div class="k">Next Share Size</div><div class="v" id="shareSize">—</div></div>
    <div class="chip"><div class="k">Trade Rate</div><div class="v" id="tradeRate">—</div></div>
    <div class="chip"><div class="k">TP Fill Rate</div><div class="v" id="tpRate">—</div></div>
  </div>

  <div class="card">
    <div class="card-title">
      <span>Current Window</span>
      <span class="countdown" id="countdown">—</span>
    </div>
    <div class="pattern-row">
      <span class="pattern-chip" id="patternChip">— — —</span>
      <span class="signal-chip" id="signalChip">—</span>
    </div>
    <div id="positionArea"></div>
  </div>

  <div class="card">
    <div class="card-title"><span>Resolved Windows</span></div>
    <div id="completedLog"><div class="empty-state">No windows resolved yet.</div></div>
  </div>

  <footer id="footer">—</footer>

<script>
  const $ = (id) => document.getElementById(id);
  const fmt$ = (n) => '$' + Number(n).toFixed(2);
  const fmtPct = (n, digits=2) => (n * 100).toFixed(digits) + '%';

  function fmtCountdown(sec) {
    if (sec == null) return '—';
    if (sec < 0) sec = 0;
    const m = Math.floor(sec / 60), s = Math.floor(sec % 60);
    return m + ':' + String(s).padStart(2,'0');
  }

  function buildSparkline(points) {
    const svg = $('sparkline');
    if (points.length < 2) { svg.innerHTML = ''; return; }
    const w = 500, h = 48, pad = 3;
    const min = Math.min(...points), max = Math.max(...points);
    const range = (max - min) || 1;
    const stepX = (w - pad*2) / (points.length - 1);
    const coords = points.map((p, i) => {
      const x = pad + i*stepX;
      const y = pad + (h - pad*2) * (1 - (p - min) / range);
      return [x, y];
    });
    const path = coords.map((c,i) => (i===0?'M':'L') + c[0].toFixed(1) + ',' + c[1].toFixed(1)).join(' ');
    const areaPath = path + ' L' + coords[coords.length-1][0].toFixed(1) + ',' + h + ' L' + coords[0][0].toFixed(1) + ',' + h + ' Z';
    const up = points[points.length-1] >= points[0];
    const stroke = up ? '#34d399' : '#f87171';
    svg.setAttribute('viewBox', '0 0 ' + w + ' ' + h);
    svg.innerHTML = '<defs><linearGradient id="sgrad" x1="0" y1="0" x2="0" y2="1">' +
      '<stop offset="0%" stop-color="' + stroke + '" stop-opacity="0.25"/>' +
      '<stop offset="100%" stop-color="' + stroke + '" stop-opacity="0"/>' +
      '</linearGradient></defs>' +
      '<path d="' + areaPath + '" fill="url(#sgrad)" stroke="none"/>' +
      '<path d="' + path + '" fill="none" stroke="' + stroke + '" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
  }

  function signalClass(signal) {
    if (signal === 'MOMENTUM_UP' || signal === 'REVERSAL_UP') return 'up';
    if (signal === 'MOMENTUM_DOWN' || signal === 'REVERSAL_DOWN') return 'down';
    if (signal === 'CHOP') return 'chop';
    return '';
  }

  function positionStatusLabel(pos) {
    if (pos.status === 'order_pending') return 'limit buy resting @ $' + pos.orderPrice.toFixed(2);
    if (pos.status === 'filled') return 'filled @ $' + pos.fillPrice.toFixed(2) + ' · TP resting @ $' + pos.tpPrice.toFixed(2);
    if (pos.status === 'tp_filled') return 'TP filled @ $' + pos.tpFillPrice.toFixed(2);
    if (pos.status === 'order_cancelled') return 'order never filled';
    if (pos.status === 'resolved_win') return 'filled @ $' + pos.fillPrice.toFixed(2) + ' · won @ resolution';
    if (pos.status === 'resolved_loss') return 'filled @ $' + pos.fillPrice.toFixed(2) + ' · lost @ resolution';
    return pos.status;
  }

  function renderPositionArea(win) {
    const el = $('positionArea');
    if (!win) { el.innerHTML = '<div class="empty-state">—</div>'; return; }
    if (win.position) {
      const pos = win.position;
      el.innerHTML = '<div class="position-box ' + pos.status + '">' +
        '<div class="side-line"><span class="side-tag ' + pos.side.toLowerCase() + '">' + pos.side + '</span><span>' + pos.shares + ' shares</span></div>' +
        '<div class="price-row"><span class="lbl">Entry</span><span>$' + pos.orderPrice.toFixed(2) + '</span></div>' +
        '<div class="price-row"><span class="lbl">TP</span><span>$' + pos.tpPrice.toFixed(2) + '</span></div>' +
        '<span class="status-pill">' + positionStatusLabel(pos) + '</span>' +
      '</div>';
    } else if (win.skipped) {
      el.innerHTML = '<div class="no-trade-box">NO TRADE — ' + (win.skipReason || 'skipped') + '</div>';
    } else {
      el.innerHTML = '<div class="no-trade-box">watching for entry…</div>';
    }
  }

  async function refresh() {
    let s;
    try {
      const res = await fetch('/api/state');
      s = await res.json();
    } catch (e) {
      console.error('fetch /api/state failed', e);
      $('footer').textContent = 'connection issue — retrying…';
      return;
    }

    try {
      const lc = s.lastCheck;
      $('livePrice').innerHTML = lc ? s.config.ASSET.toUpperCase() + ' market' : '—';
      $('countdown').textContent = lc ? (Math.max(0, lc.secondsRemaining) > 0 ? fmtCountdown(lc.secondsRemaining) + ' left' : 'resolving…') : '—';
    } catch (e) { console.error('header render failed', e); }

    try {
      $('bankroll').textContent = fmt$(s.bankroll);
      const retPct = (s.bankroll - s.startingBankroll) / s.startingBankroll;
      const retEl = $('returnPct');
      retEl.textContent = (retPct >= 0 ? '+' : '') + fmtPct(retPct, 2);
      retEl.className = 'return ' + (retPct >= 0 ? 'pos' : 'neg');
    } catch (e) { console.error('bankroll render failed', e); }

    try {
      const curve = [s.startingBankroll];
      for (const w of s.windowHistory) curve.push(w.bankrollAfter);
      buildSparkline(curve);
    } catch (e) { console.error('sparkline render failed', e); }

    try {
      const win = s.currentWindow;
      $('patternChip').textContent = win && win.pattern ? win.pattern : '— — —';
      const sigEl = $('signalChip');
      sigEl.textContent = win ? win.signal : '—';
      sigEl.className = 'signal-chip ' + (win ? signalClass(win.signal) : '');
      renderPositionArea(win);
    } catch (e) { console.error('current window render failed', e); }

    try {
      const hist = s.windowHistory;
      $('windowsResolved').textContent = hist.length;
      const totalPnl = hist.reduce((a,w) => a+w.pnl, 0);
      $('totalPnl').textContent = fmt$(totalPnl);
      $('totalPnl').style.color = totalPnl >= 0 ? 'var(--win)' : 'var(--loss)';
      const traded = hist.filter(w => w.traded);
      $('avgPnl').textContent = traded.length ? fmt$(traded.reduce((a,w)=>a+w.pnl,0)/traded.length) : '—';
      $('pendingCount').textContent = s.pendingResolutions.length;
    } catch (e) { console.error('chips render failed', e); }

    try {
      const hist = s.windowHistory;
      const lossStreak = s.consecutiveLosses || 0;
      const streakEl = $('lossStreak');
      streakEl.textContent = lossStreak;
      streakEl.className = 'v' + (lossStreak > 0 ? ' warn' : '');
      $('shareSize').textContent = (s.currentShareSize != null ? s.currentShareSize : '—');
      if (hist.length) {
        const traded = hist.filter(w => w.traded);
        $('tradeRate').textContent = traded.length + ' / ' + hist.length;
        const settled = traded.filter(w => w.position && (w.position.status === 'tp_filled' || w.position.status === 'resolved_win' || w.position.status === 'resolved_loss'));
        const tp = settled.filter(w => w.position.status === 'tp_filled');
        $('tpRate').textContent = settled.length ? tp.length + ' / ' + settled.length : '—';
      } else {
        $('tradeRate').textContent = '—';
        $('tpRate').textContent = '—';
      }
    } catch (e) { console.error('martingale chips render failed', e); }

    try {
      const logEl = $('completedLog');
      const all = s.windowHistory.slice().reverse().slice(0, 40);
      if (all.length === 0) {
        logEl.innerHTML = '<div class="empty-state">No windows resolved yet.</div>';
      } else {
        const fmtTime = (iso) => iso ? new Date(iso).toLocaleString(undefined,{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit',second:'2-digit'}) : '—';
        logEl.innerHTML = all.map((w) => {
          const cls = !w.traded ? 'skip' : (w.pnl >= 0 ? 'win' : 'loss');
          const marginPct = w.cost > 0 ? (w.pnl / w.cost) * 100 : 0;
          const sideTag = w.traded
            ? '<span class="side-tag ' + w.side.toLowerCase() + '">' + w.side + '</span>'
            : '<span class="side-tag skip">no trade</span>';
          const badge = w.traded && w.position && w.position.status === 'tp_filled'
            ? '<span class="fill-badge tp">TP hit</span>' : '';
          let detailRows = '<div class="drow"><span>Pattern</span><span>' + (w.pattern || '(none)') + '</span></div>' +
            '<div class="drow"><span>Signal</span><span>' + w.signal + '</span></div>';
          if (w.traded && w.position) {
            const p = w.position;
            detailRows += '<div class="drow"><span>Entry / TP</span><span>' +
              (p.fillPrice !== null ? '$'+p.fillPrice.toFixed(2) : '—') + ' / ' +
              (p.tpFillPrice !== null ? '$'+p.tpFillPrice.toFixed(2) : '—') + '</span></div>';
          } else {
            detailRows += '<div class="drow"><span>Reason</span><span>' + (w.skipReason || '—') + '</span></div>';
          }
          return '<div class="entry" onclick="this.querySelector(\'.entry-detail\').classList.toggle(\'open\')">' +
            '<div class="row1">' +
              '<span class="result-dot ' + cls + '"></span>' +
              '<div class="mid">' +
                '<div class="top">' + sideTag + ' <span class="side-tag ' + w.wonSide.toLowerCase() + '">' + w.wonSide + ' won</span> ' + badge + '</div>' +
                '<div class="bottom">payout $' + w.payout.toFixed(2) + ' − cost $' + w.cost.toFixed(2) + ' (fees $' + (w.totalFees || 0).toFixed(4) + ', est. rebates +$' + (w.totalRebates || 0).toFixed(4) + ') · ' + fmtTime(w.resolvedAt) + '</div>' +
              '</div>' +
              '<div class="pnl ' + cls + '">' + (w.traded ? (w.pnl >= 0 ? '+' : '') + w.pnl.toFixed(2) : '—') + (w.traded ? '<span class="margin">' + (marginPct >= 0 ? '+' : '') + marginPct.toFixed(2) + '%</span>' : '') + '</div>' +
            '</div>' +
            '<div class="entry-detail">' + detailRows + '</div>' +
          '</div>';
        }).join('');
      }
    } catch (e) { console.error('completed log render failed', e); }

    $('footer').textContent = 'updated ' + new Date().toLocaleTimeString() + ' · polling every 1s' +
      (s.lastCheck ? ' · bot last ticked ' + Math.max(0, Math.floor((Date.now() - new Date(s.lastCheck.timestamp).getTime())/1000)) + 's ago' : '');
  }

  refresh();
  setInterval(refresh, 1000);
</script>
</body>
</html>
