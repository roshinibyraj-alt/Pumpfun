<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>BTC Fair-Value Bot</title>
<style>
  :root {
    --bg: #0b0e14; --panel: #131722; --border: #232838;
    --text: #e6e9f0; --dim: #8892a6; --green: #26d07c; --red: #f0546a; --accent: #5b8def;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: -apple-system, system-ui, sans-serif; padding: 20px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: var(--dim); font-size: 13px; margin-bottom: 20px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 14px; }
  .card .label { color: var(--dim); font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; }
  .card .value { font-size: 22px; font-weight: 600; margin-top: 4px; }
  .green { color: var(--green); } .red { color: var(--red); }
  section { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 14px; margin-bottom: 16px; }
  section h2 { font-size: 14px; margin: 0 0 10px; color: var(--dim); text-transform: uppercase; letter-spacing: 0.5px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); }
  th { color: var(--dim); font-weight: 500; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 600; }
  .badge.up { background: rgba(38,208,124,0.15); color: var(--green); }
  .badge.down { background: rgba(240,84,106,0.15); color: var(--red); }
  .empty { color: var(--dim); font-size: 13px; padding: 10px 0; }
  .demo-tag { background: rgba(91,141,239,0.15); color: var(--accent); padding: 2px 8px; border-radius: 6px; font-size: 12px; }
</style>
</head>
<body>
  <h1>BTC Fair-Value Bot <span id="demoTag" class="demo-tag">DEMO</span></h1>
  <div class="sub">Fair-value drift model vs Polymarket 15-min up/down markets. Auto-refreshes every 10s.</div>

  <div class="grid">
    <div class="card"><div class="label">Bankroll</div><div class="value" id="bankroll">—</div></div>
    <div class="card"><div class="label">Total Return</div><div class="value" id="returnPct">—</div></div>
    <div class="card"><div class="label">Trades</div><div class="value" id="tradeCount">—</div></div>
    <div class="card"><div class="label">Win Rate</div><div class="value" id="winRate">—</div></div>
  </div>

  <section>
    <h2>Open Position</h2>
    <div id="openPosition" class="empty">No open position right now.</div>
  </section>

  <section>
    <h2>Trade Log</h2>
    <div id="tradeLogWrap"><div class="empty">No trades yet.</div></div>
  </section>

  <script>
    function fmt$(n) { return '$' + Number(n).toFixed(2); }
    function pct(n) { return (n >= 0 ? '+' : '') + n.toFixed(2) + '%'; }

    async function refresh() {
      try {
        const res = await fetch('/api/state');
        const s = await res.json();

        document.getElementById('demoTag').textContent = s.config.DEMO_MODE ? 'DEMO' : 'LIVE';
        document.getElementById('bankroll').textContent = fmt$(s.bankroll);

        const retPct = ((s.bankroll - s.startingBankroll) / s.startingBankroll) * 100;
        const retEl = document.getElementById('returnPct');
        retEl.textContent = pct(retPct);
        retEl.className = 'value ' + (retPct >= 0 ? 'green' : 'red');

        document.getElementById('tradeCount').textContent = s.trades.length;

        const wins = s.trades.filter(t => t.won).length;
        document.getElementById('winRate').textContent = s.trades.length
          ? Math.round((wins / s.trades.length) * 100) + '%'
          : '—';

        const posEl = document.getElementById('openPosition');
        if (s.openPosition) {
          const p = s.openPosition;
          posEl.innerHTML = `
            <span class="badge ${p.side.toLowerCase()}">${p.side}</span>
            &nbsp; stake ${fmt$(p.stake)} @ price ${p.price.toFixed(3)}
            &nbsp; strike ${p.strike.toFixed(2)}
            &nbsp; edge ${(p.edge * 100).toFixed(1)}%
            &nbsp; opened ${new Date(p.openedAt).toLocaleTimeString()}
          `;
        } else {
          posEl.innerHTML = '<div class="empty">No open position right now.</div>';
        }

        const wrap = document.getElementById('tradeLogWrap');
        if (s.trades.length === 0) {
          wrap.innerHTML = '<div class="empty">No trades yet.</div>';
        } else {
          const rows = s.trades.slice().reverse().slice(0, 50).map(t => `
            <tr>
              <td>${new Date(t.resolvedAt).toLocaleString()}</td>
              <td><span class="badge ${t.side.toLowerCase()}">${t.side}</span></td>
              <td>${fmt$(t.stake)}</td>
              <td>${t.price.toFixed(3)}</td>
              <td>${(t.edge * 100).toFixed(1)}%</td>
              <td class="${t.won ? 'green' : 'red'}">${t.won ? 'WIN' : 'LOSS'}</td>
              <td class="${t.pnl >= 0 ? 'green' : 'red'}">${t.pnl >= 0 ? '+' : ''}${t.pnl.toFixed(2)}</td>
              <td>${fmt$(t.bankrollAfter)}</td>
            </tr>
          `).join('');
          wrap.innerHTML = `
            <table>
              <thead><tr><th>Time</th><th>Side</th><th>Stake</th><th>Price</th><th>Edge</th><th>Result</th><th>PnL</th><th>Bankroll</th></tr></thead>
              <tbody>${rows}</tbody>
            </table>
          `;
        }
      } catch (e) {
        console.error('refresh failed', e);
      }
    }

    refresh();
    setInterval(refresh, 10000);
  </script>
</body>
</html>
